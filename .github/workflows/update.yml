name: Update prices and publish

on:
  schedule:
    - cron: '7,37 13-21 * * 1-5'   # every 30 min while US markets are open, summer and winter time (times are UTC)
    - cron: '45 21 * * 1-5'        # after the US close: full refresh of every symbol
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: 'quick = last month only, full = re-download all history'
        default: full
        type: choice
        options: [full, quick]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download prices
        env:
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          MODE: ${{ github.event.inputs.mode || (github.event.schedule == '45 21 * * 1-5' && 'full') || 'quick' }}
        run: python scripts/update.py --mode "$MODE"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      # GitHub pauses scheduled jobs in a project with no commits for 60 days; a small monthly commit keeps it running.
      - name: Keep the schedule alive
        if: github.event.schedule == '45 21 * * 1-5'
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 30 * 86400 )) ]; then
            date -u +%FT%TZ > .github/keepalive
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/keepalive && git commit -m "Keep the price schedule active" && git push
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
